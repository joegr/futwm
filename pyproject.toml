[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soccer-world-model"
version = "0.1.0"
description = "Stochastic world-model based prediction of soccer events with formal ontology and interchange formats."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Soccer World Model Contributors" },
]
keywords = ["soccer", "football", "events", "prediction", "world-model", "stochastic", "xg", "ontology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
server = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/soccer-world-model/soccer-world-model"
Documentation = "https://github.com/soccer-world-model/soccer-world-model#readme"
Repository = "https://github.com/soccer-world-model/soccer-world-model"
Issues = "https://github.com/soccer-world-model/soccer-world-model/issues"

[project.scripts]
soccer-model-server = "soccer_model.server:run"

[tool.hatch.build.targets.sdist]
include = [
    "soccer_model/",
    "frontend/",
    "examples/",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["soccer_model"]

[tool.hatch.build.targets.wheel.force-include]
"frontend" = "soccer_model/_frontend"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
