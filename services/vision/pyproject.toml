[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soccer-vision-service"
version = "0.1.0"
description = "Computer-vision microservice that ingests video/frames, runs CV kernels, and emits canonical soccer_model MatchEventStream events."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Soccer World Model Contributors" }]
keywords = ["soccer", "football", "computer-vision", "tracking", "homography", "kernel", "microservice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Core deps are intentionally small. Heavy ML deps go under optional extras
# so the service can boot for contract testing, schema-only operation, or
# in environments without CUDA.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "soccer-world-model>=0.1.0",
]

[project.optional-dependencies]
# Real ML stack — lazily imported at runtime; not required for the API or
# pure-numpy kernels to function.
ml = [
    "opencv-python-headless>=4.9.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.1.0",      # YOLOv8 — players/ball detector
]
# Video transport adapters.
streaming = [
    "av>=11.0.0",              # PyAV — ffmpeg bindings for RTSP / mp4
    "websockets>=12.0",
]
# Development.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",             # FastAPI test client
    "ruff",
    "mypy",
]

[project.scripts]
soccer-vision = "soccer_vision.api.server:cli"

[tool.hatch.build.targets.wheel]
packages = ["soccer_vision"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
