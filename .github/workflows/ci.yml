name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Lint with ruff
        run: ruff check soccer_model/

      - name: Type check with mypy
        run: mypy soccer_model/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Validate schema & sample round-trip
        run: |
          python -c "
          import soccer_model as sm
          stream = sm.load_sample()
          assert len(stream.events) > 0
          data = sm.to_json_dict(stream)
          result = sm.validate_event_stream(data)
          assert result.valid, result.errors
          print(f'OK: {len(stream.events)} events, schema valid')
          "

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: docker build & compose smoke-test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build every service defined in docker-compose.yml (dashboard + vision).
      # `--profile full` selects the vision service which is opt-in for local
      # dev so it must be explicitly enabled here.
      - name: Build all compose services
        run: docker compose --profile full build

      # Start every service in detached mode. The dashboard image is the
      # critical one for the frontend; the vision service is built to prove
      # the monorepo Dockerfile still resolves.
      - name: Start dashboard
        run: docker compose up -d app

      - name: Wait for /api/pitch healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5050/api/pitch > /dev/null; then
              echo "Dashboard is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Dashboard failed to become healthy"
          docker compose logs app
          exit 1

      - name: Smoke-test API endpoints
        run: |
          set -euo pipefail
          for path in /api/pitch /api/ontology /api/preprocess/ops; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:5050${path}")
            echo "GET ${path} -> ${code}"
            [ "$code" = "200" ]
          done

      - name: Tail container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v
